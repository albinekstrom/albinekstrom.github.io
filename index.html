<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
<meta name="theme-color" content="#E9EEF1">
<meta name="robots" content="noindex, nofollow">
<title>Albin Ekström</title>
<link rel="stylesheet" href="css/landing.css">
</head>
<body>

<main class="stage">

  <h1 class="name">Albin Ekström</h1>

  <!-- Locked. The link list is not in this document; it is ciphertext in
       data/links.enc and is decrypted in the browser. -->
  <form class="gate" id="gate" hidden>
    <label class="gatelab" for="pass">Passphrase</label>
    <div class="gaterow">
      <input type="password" id="pass" autocomplete="current-password"
             autocapitalize="none" spellcheck="false" aria-describedby="gate-msg">
      <button class="go" type="submit" aria-label="Unlock">→</button>
    </div>
    <label class="remember">
      <input type="checkbox" id="remember" checked>
      <span>Remember on this device</span>
    </label>
    <p class="msg" id="gate-msg" role="status" aria-live="polite"></p>
  </form>

  <!-- Unlocked -->
  <nav class="links" id="links" hidden aria-label="Projects"></nav>

  <button class="lock" id="lock" hidden type="button">Lock</button>

  <noscript>
    <p class="msg">This page needs JavaScript to decrypt its link list.</p>
  </noscript>

</main>

<script type="module" src="js/landing.js"></script>
</body>
</html>
